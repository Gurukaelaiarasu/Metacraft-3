trigger:
  - main

resources:
  - repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'your-docker-registry-connection'
  imageRepository: 'photonic-structure-analyzer'
  containerRegistry: 'your-container-registry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/azure-deployment/Dockerfile'
  tag: '$(Build.BuildId)'
  
  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push an image to container registry
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              containerRegistry: $(dockerRegistryServiceConnection)
              dockerfile: $(dockerfilePath)
              tags: |
                $(tag)
                latest
          
          - task: AzureRmWebAppDeployment@4
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'your-azure-subscription'
              appType: 'webAppContainer'
              WebAppName: 'your-webapp-name'
              DockerNamespace: $(containerRegistry)
              DockerRepository: $(imageRepository)
              DockerImageTag: '$(tag)'
              AppSettings: '-WEBSITES_PORT 8000 -DATABASE_URL $(DATABASE_URL)'